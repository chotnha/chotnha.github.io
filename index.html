<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#1a1a1a" />
<title>Broker OS - Định Giá BĐS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23FF1744'/><text x='50' y='70' font-size='60' font-weight='900' text-anchor='middle' fill='white' font-family='sans-serif'>B</text></svg>" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
  background: #F7F7F7;
  color: #1a1a1a;
  max-width: 480px;
  margin: 0 auto;
  position: relative;
  overflow-x: hidden;
  min-height: 100vh;
}

.screen { min-height: 100vh; padding-bottom: 110px; }
.hidden { display: none !important; }

/* ===== Hero (home) ===== */
.hero {
  background: #1a1a1a;
  color: #fff;
  padding: 20px 20px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.hero-bg { display: none; }
.hero-content { display: flex; align-items: center; gap: 12px; width: 100%; }
.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 0; flex: 1; }
.brand-mark {
  width: 36px; height: 36px;
  background: #FF1744;
  border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 18px; color: white;
}
.brand-name { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; color: white; }
.brand-sub { font-size: 11px; color: rgba(255,255,255,0.5); letter-spacing: 0.3px; }
.hero-title { display: none; }
.hero-desc { display: none; }

/* ===== TopBar ===== */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px;
  background: #F7F7F7;
  position: sticky; top: 0; z-index: 10;
  border-bottom: 1px solid #E8E8E8;
}
.topbar-back {
  width: 38px; height: 38px;
  border-radius: 11px;
  background: white;
  border: none;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  border: 1px solid #E8E8E8;
  font-size: 18px; color: #000000;
}
.topbar-title { font-size: 18px; font-weight: 700; }
.topbar-spacer { width: 38px; }

/* ===== Content ===== */
.content-pad { padding: 16px; }
.section-title {
  font-size: 14px; font-weight: 700;
  margin: 22px 4px 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* ===== Stats ===== */
.stats-row {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  margin: 0 0 0 0;
  position: relative; z-index: 2;
}
.stat-card {
  background: #fff;
  border-radius: 14px;
  padding: 16px 8px;
  text-align: center;
  border: 1px solid #E8E8E8;
}
.stat-num { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
.stat-num.accent { color: #FF1744; font-size: 17px; }
.stat-label { font-size: 13px; color: #000000; margin-top: 2px; font-weight: 500; }

/* ===== Action Card ===== */
.action-card {
  background: #fff;
  border-radius: 14px;
  padding: 16px;
  display: flex; align-items: center; gap: 14px;
  border: none; width: 100%; text-align: left;
  cursor: pointer;
  margin-bottom: 10px;
  transition: transform 0.15s ease;
  font-family: inherit;
}
.action-card:active { transform: scale(0.98); }
.action-card.primary-card {
  background: #fff;
  border: 1.5px solid #FF1744;
}
.action-icon {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: transparent;
  color: #1a1a1a;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 20px;
  border: 1.5px solid #1a1a1a;
}
.action-icon.red { background: linear-gradient(135deg, #FF1744, #CC0000); }
.action-icon.outlined { background: white; color: #1a1a1a; border: 1.5px solid #1a1a1a; }
.action-text { flex: 1; min-width: 0; }
.action-title { font-size: 16px; font-weight: 700; margin-bottom: 2px; color: #000000; }
.action-desc { font-size: 14px; color: #000000; }
.action-arrow { color: #000000; font-size: 18px; }

/* ===== Recent ===== */
.recent-card {
  background: white; border-radius: 12px; padding: 14px;
  border: 1px solid #E8E8E8; width: 100%; text-align: left;
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 8px; cursor: pointer;
  font-family: inherit;
}
.recent-card:active { transform: scale(0.98); }
.recent-left { flex: 1; min-width: 0; }
.recent-addr { font-size: 16px; font-weight: 600; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #000000; }
.recent-meta { font-size: 13px; color: #000000; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.recent-meta .dot { color: #000000; }
.recent-meta .price { color: #FF1744; font-weight: 700; }
.recent-arrow { color: #000000; font-size: 18px; }

/* ===== Search ===== */
.search-box {
  background: #FFFFFF; border-radius: 12px; padding: 10px 14px;
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 14px;
  border: 1.5px solid #1a1a1a;
}
.search-icon { color: #000000; font-size: 14px; }
.search-input { border: none; outline: none; flex: 1; font-size: 14px; background: transparent; font-family: inherit; }

/* ===== Prop Card ===== */
.prop-card {
  background: white; border-radius: 14px; padding: 16px;
  margin-bottom: 10px; cursor: pointer;
  border: 1px solid #E8E8E8;
}
.prop-card:active { transform: scale(0.98); }
.prop-head { display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px; }
.prop-addr { font-size: 16px; font-weight: 700; flex: 1; }
.badge-valued { font-size: 16px; margin-left: 8px; }
.prop-specs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.spec {
  font-size: 13px; color: #000000;
  background: #FFFFFF; border: 1px solid #e0e0e0; padding: 4px 10px; border-radius: 6px;
}
.prop-prices { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px dashed #eee; }
.prop-price { font-size: 14px; color: #000000; }
.prop-price b { color: #1a1a1a; }
.prop-diff { font-size: 13px; font-weight: 700; padding: 3px 8px; border-radius: 5px; }
.prop-diff.high { background: #FEE; color: #FF1744; }
.prop-diff.low { background: #E8F5E9; color: #2E7D32; }
.prop-diff.mid { background: #FFF8E1; color: #F57C00; }

/* ===== Empty ===== */
.empty-state { text-align: center; padding: 60px 20px; }
.empty-icon { font-size: 48px; color: #ddd; margin-bottom: 12px; }
.empty-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.empty-desc { font-size: 15px; color: #000000; }

/* ===== Card ===== */
.card {
  background: #fff;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 12px;
  border: 1px solid #E8E8E8;
}
.card-header { font-size: 18px; font-weight: 700; margin-bottom: 16px; }

/* ===== Form ===== */
.field { margin-bottom: 12px; }
.field-label { font-size: 14px; color: #000000; font-weight: 600; margin-bottom: 6px; }
.field-hint { font-size: 13px; color: #000000; margin-top: 4px; line-height: 1.5; }
.input {
  width: 100%; padding: 12px 14px;
  border: 0.6px solid #1a1a1a; border-radius: 10px;
  font-size: 17px; background: #FFFFFF;
  outline: none; font-family: inherit;
  transition: border-color 0.15s;
}
.input:focus { border-color: #FF1744; background: #FFFFFF; }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.textarea {
  width: 100%; padding: 12px 14px;
  border: 0.6px solid #1a1a1a; border-radius: 10px;
  font-size: 16px; background: #FFFFFF;
  outline: none; font-family: inherit;
  min-height: 178px; resize: vertical;
}
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.chip {
  padding: 8px 14px;
  border-radius: 999px;
  background: #FFFFFF;
  border: 1.5px solid #1a1a1a;
  font-size: 15px; font-weight: 500;
  cursor: pointer; transition: all 0.15s;
  color: #000000; font-family: inherit;
}
.chip.on { background: #fff; border-color: #FF1744; color: #FF1744; font-weight: 700; }
.chip.on.warn { background: #FEF5F5; }

/* ===== Buttons ===== */
.btn-primary, .btn-secondary {
  padding: 13px 20px;
  border-radius: 11px;
  font-size: 16px; font-weight: 700;
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-family: inherit;
  transition: transform 0.1s;
  border: 1px solid;
}
.btn-primary {
  background: #FF1744; color: white; border-color: #FF1744;
  
}
.btn-primary:active { transform: scale(0.97); }
.btn-primary:disabled { background: #ccc; border-color: #000000; box-shadow: none; cursor: not-allowed; }
.btn-secondary {
  background: white; color: #FF1744; border-color: #FF1744;
}
.btn-full { width: 100%; }

/* ===== Bottom Bar ===== */
.bottom-bar {
  width: 100%;
  max-width: 480px;
  background-color: #FFFFFF;
  padding: 12px 16px 20px;
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  border-top: 0.6px solid #E8E8E8;
  z-index: 50;
}
.bar-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ===== Detail Hero ===== */
.hero-detail {
  background: linear-gradient(135deg, #1a0a0a 0%, #2d1010 50%, #1a0505 100%);
  color: white;
  border-radius: 16px;
  padding: 22px 20px;
  margin-bottom: 18px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
}
.hero-detail-label { font-size: 10px; opacity: 0.6; letter-spacing: 1.5px; }
.hero-detail-addr { font-size: 20px; font-weight: 800; margin: 6px 0; letter-spacing: -0.5px; }
.hero-detail-meta { font-size: 12px; opacity: 0.75; display: flex; gap: 8px; flex-wrap: wrap; }
.hero-prices {
  display: grid; grid-template-columns: 1fr 1px 1fr 1px 1fr;
  margin-top: 18px; padding-top: 18px;
  border-top: 1px solid rgba(255,255,255,0.1);
  align-items: center; gap: 4px;
}
.hero-price-item { text-align: center; }
.hero-price-lbl { font-size: 10px; opacity: 0.6; text-transform: uppercase; letter-spacing: 0.5px; }
.hero-price-val { font-size: 16px; font-weight: 800; margin-top: 4px; }
.hero-price-val.red { color: #FF6B6B; }
.hero-price-val.green { color: #6FE5A8; }
.hero-price-divider { height: 30px; background: rgba(255,255,255,0.15); }

.info-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 11px 0;
  border-bottom: 1px solid #E8E8E8;
  font-size: 15px;
  gap: 10px;
}
.info-row:last-child { border-bottom: none; }
.info-lbl { color: #000000; flex-shrink: 0; }
.info-val { font-weight: 600; text-align: right; }
.notes-text { font-size: 13px; line-height: 1.6; color: #000000; white-space: pre-wrap; word-break: break-word; }

/* ===== Valuation Report ===== */
.report-hero {
  background: #FFFFFF;
  border-radius: 16px;
  padding: 22px;
  margin-bottom: 14px;
  border: 1px solid #eee;
  border-left: 4px solid #FF1744;
}
.report-stamp { font-size: 10px; font-weight: 800; color: #FF1744; letter-spacing: 2px; margin-bottom: 8px; }
.report-addr { font-size: 17px; font-weight: 800; line-height: 1.3; margin-bottom: 6px; }
.report-date { font-size: 11px; color: #000000; }

.result-card { background: linear-gradient(165deg, #fff 0%, #FFF8F8 100%); border: 1.5px solid #FBD7D7; }
.result-label { font-size: 11px; color: #FF1744; font-weight: 700; letter-spacing: 1.5px; }
.result-main {
  font-size: 42px; font-weight: 800;
  margin: 8px 0; letter-spacing: -2px; line-height: 1;
}
.result-main .unit { font-size: 20px; color: #000000; font-weight: 600; letter-spacing: 0; }
.result-range { font-size: 13px; color: #000000; margin-bottom: 24px; }

.verdict {
  padding: 14px 16px; border-radius: 12px;
  font-size: 13px; font-weight: 700;
  margin-top: 8px;
}
.verdict.good { background: #E8F5E9; color: #2E7D32; }
.verdict.mid { background: #FFF8E1; color: #E65100; }
.verdict.warn { background: #FFF3E0; color: #E65100; }
.verdict.bad { background: #FFEBEE; color: #C62828; }

.calc-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; font-size: 15px; }
.calc-lbl { color: #000000; display: flex; flex-direction: column; flex: 1; }
.calc-lbl.bold { font-weight: 700; color: #1a1a1a; font-size: 14px; }
.calc-detail { font-size: 10px; color: #000000; margin-top: 2px; }
.calc-detail-row { font-size: 10px; color: #000000; padding-bottom: 6px; }
.calc-val { font-weight: 700; font-size: 13px; }
.calc-val.minus { color: #FF1744; }
.calc-val.plus { color: #2E7D32; }
.calc-val.total-val { color: #1a1a1a; font-size: 16px; }
.calc-divider { height: 1px; background: #f0f0f0; margin: 4px 0; }
.calc-divider.strong { background: #1a1a1a; height: 1.5px; margin: 8px 0; }

.compare-row { display: flex; justify-content: space-between; padding: 10px 0; font-size: 13px; color: #000000; border-bottom: 1px solid #E8E8E8; }
.compare-row .bold { color: #1a1a1a; font-weight: 700; }
.compare-row .green { color: #2E7D32; }
.compare-row .red { color: #FF1744; }

.negotiation-box {
  background: linear-gradient(135deg, #1a1a1a, #2a1010);
  color: white; border-radius: 12px;
  padding: 16px; margin-top: 14px;
}
.neg-title { font-size: 11px; opacity: 0.7; letter-spacing: 1px; }
.neg-price { font-size: 28px; font-weight: 800; letter-spacing: -1px; margin: 4px 0 8px; }
.neg-price::after { content: ' tỷ'; font-size: 16px; opacity: 0.7; font-weight: 500; }
.neg-desc { font-size: 12px; opacity: 0.85; line-height: 1.5; }

.point-row {
  display: flex; gap: 10px; align-items: start;
  padding: 8px 0; font-size: 13px; line-height: 1.4;
}
.point-icon { flex-shrink: 0; margin-top: 2px; font-size: 14px; }
.point-row.strength .point-icon { color: #2E7D32; }
.point-row.weakness .point-icon { color: #E65100; }

.disclaimer {
  font-size: 11px; color: #000000;
  background: #FFF8E1;
  padding: 12px 14px;
  border-radius: 10px;
  line-height: 1.5;
  margin-top: 14px;
}

/* ===== AI ===== */
.ai-hero {
  background: linear-gradient(135deg, #1a1a1a 0%, #4a1515 100%);
  color: white; border-radius: 16px;
  padding: 22px 20px; margin-bottom: 14px;
}
.ai-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(10px);
  padding: 5px 11px; border-radius: 999px;
  font-size: 10px; font-weight: 700; letter-spacing: 1px;
}
.ai-title { font-size: 22px; font-weight: 800; margin: 10px 0 4px; letter-spacing: -0.5px; }
.ai-desc { font-size: 13px; opacity: 0.7; }

.ai-loading { text-align: center; padding: 40px 20px; }
.spinner {
  width: 36px; height: 36px;
  border: 3px solid #f0f0f0;
  border-top-color: #FF1744;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.loading-desc { font-size: 12px; color: #000000; line-height: 1.5; }

.error-card { text-align: center; padding: 24px; }
.error-icon { color: #C62828; font-size: 28px; margin-bottom: 8px; }
.error-text { color: #C62828; font-size: 13px; margin-bottom: 12px; }

.ai-text { font-size: 15px; line-height: 1.65; color: #333; }
.ai-script {
  font-size: 13px; line-height: 1.7;
  color: #000000; font-style: italic;
  background: #FFFFFF;
  padding: 14px 16px; border-radius: 10px;
  border-left: 3px solid #FF1744;
  border: 1px solid #E8E8E8;
  border-left: 3px solid #FF1744;
}
.ai-special { background: linear-gradient(135deg, #fff 0%, #FFF8F0 100%); }

.step-row {
  display: flex; gap: 12px; align-items: start;
  padding: 10px 0;
  border-bottom: 1px dashed #eee;
}
.step-row:last-child { border-bottom: none; }
.step-num {
  width: 24px; height: 24px;
  background: #FF1744; color: white;
  border-radius: 7px;
  font-size: 11px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.step-text { font-size: 15px; line-height: 1.5; color: #333; padding-top: 3px; }

/* API Key Modal */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 100;
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.modal {
  background: white; border-radius: 16px;
  padding: 24px; max-width: 400px; width: 100%;
}
.modal-title { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
.modal-desc { font-size: 13px; color: #000000; line-height: 1.6; margin-bottom: 16px; }
.modal-link { color: #FF1744; font-weight: 600; text-decoration: none; }

/* Login Screen */
.login-screen {
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 32px;
  background: linear-gradient(135deg, #1a1a1a 0%, #2a1010 60%, #4a1515 100%);
  position: relative; overflow: hidden;
}
.login-bg {
  position: absolute; inset: 0;
  background-image:
    radial-gradient(circle at 80% 20%, rgba(255,23,68,0.35) 0%, transparent 50%),
    radial-gradient(circle at 10% 80%, rgba(255,23,68,0.15) 0%, transparent 40%);
}
.login-content { position: relative; z-index: 1; text-align: center; width: 100%; max-width: 320px; }
.login-mark {
  width: 64px; height: 64px;
  background: linear-gradient(135deg, #FF1744, #CC0000);
  border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 32px; color: white;
  box-shadow: 0 8px 24px rgba(255,23,68,0.4);
  margin: 0 auto 20px;
}
.login-title { font-size: 28px; font-weight: 800; color: white; letter-spacing: -1px; margin-bottom: 8px; }
.login-sub { font-size: 13px; color: rgba(255,255,255,0.65); margin-bottom: 36px; line-height: 1.5; }
.btn-google {
  width: 100%; padding: 14px 20px;
  background: white; color: #1a1a1a;
  border: none; border-radius: 12px;
  font-size: 15px; font-weight: 700;
  cursor: pointer; font-family: inherit;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.15);
  transition: transform 0.1s;
}
.btn-google:active { transform: scale(0.97); }
.btn-google img { width: 20px; height: 20px; }
.login-footer { margin-top: 24px; font-size: 11px; color: rgba(255,255,255,0.4); line-height: 1.5; }
.user-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; margin: -8px -4px 12px;
  background: #FFFFFF; border-radius: 10px; border: 1px solid #E8E8E8;
  font-size: 12px; color: #000000;
}
.user-bar img { width: 24px; height: 24px; border-radius: 50%; }
.user-bar .user-name { flex: 1; font-weight: 600; color: #1a1a1a; }
.btn-logout { background: none; border: none; color: #FF1744; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; }
.loading-screen {
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: #F9F9F9;
}
.loading-screen .spinner { width: 36px; height: 36px; border: 3px solid #f0f0f0; border-top-color: #FF1744; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }


/* ===== Form Flat (không card wrapper) ===== */
.form-flat { padding: 16px 16px 16px; }
.form-section-label {
  font-size: 11px;
  font-weight: 700;
  color: #000000;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 14px;
}
.form-flat .field { margin-bottom: 14px; }
.form-flat .input {
  padding: 14px 16px;
  border-radius: 12px;
  border-width: 0.6px;
}
.form-flat .textarea {
  padding: 14px 16px;
  border-radius: 12px;
  min-height: 178px;
  resize: vertical;
}


/* Select dropdown */
.input::placeholder { color: #aaa; }
.f-select-wrap { position: relative; margin-bottom: 14px; }
.f-select-wrap .field-label { font-size: 14px; font-weight: 600; color: #000000; margin-bottom: 6px; display: block; }
select.input {
  width: 100%; appearance: none; -webkit-appearance: none;

<body>

<div id="app"></div>


<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
// ============== FIREBASE CONFIG ==============
const firebaseConfig = {
  apiKey: "AIzaSyB4GDjBsdix-c6CAT3OChDqGG1AlLAsCyU",
  authDomain: "chotnha-97467.firebaseapp.com",
  projectId: "chotnha-97467",
  storageBucket: "chotnha-97467.firebasestorage.app",
  messagingSenderId: "1076265056428",
  appId: "1:1076265056428:web:2f54fa02b99a301fdf4709"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const dbFS = firebase.firestore();
const googleProvider = new firebase.auth.GoogleAuthProvider();

// ============== DATA MANAGEMENT (FIREBASE) ==============
const API_KEY_STORE = 'gemini_api_key_v1';
let currentUser = null;
let unsubscribeFirestore = null;

function getApiKey() {
  try { return sessionStorage.getItem(API_KEY_STORE) || ''; } catch(e) { return ''; }
}
function setApiKey(key) {
  try { sessionStorage.setItem(API_KEY_STORE, key); } catch(e) {}
}

async function saveDataToFirestore(arr) {
  if (!currentUser) return;
  try {
    await dbFS.collection('users').doc(currentUser.uid).set({
      properties: JSON.stringify(arr),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
  } catch(e) { console.error('Firestore save error:', e); }
}

function listenToFirestore() {
  if (unsubscribeFirestore) unsubscribeFirestore();
  if (!currentUser) return;
  unsubscribeFirestore = dbFS.collection('users').doc(currentUser.uid).onSnapshot(function(doc) {
    if (doc.exists && doc.data().properties) {
      try {
        const props = JSON.parse(doc.data().properties);
        if (Array.isArray(props)) { state.properties = props; render(); }
      } catch(e) { console.error('Parse error:', e); }
    }
  }, function(err) { console.error('Firestore listen error:', err); });
}

async function signInWithGoogle() {
  try {
    state.authLoading = true; render();
    await auth.signInWithPopup(googleProvider);
  } catch(e) {
    console.error('Login error:', e);
    state.authLoading = false; render();
    if (e.code !== 'auth/popup-closed-by-user') alert('Đăng nhập thất bại: ' + e.message);
  }
}

async function signOut() {
  if (confirm('Đăng xuất?')) {
    if (unsubscribeFirestore) unsubscribeFirestore();
    await auth.signOut();
    currentUser = null;
    state.properties = [];
    state.screen = 'login'; render();
  }
}

auth.onAuthStateChanged(function(user) {
  if (user) {
    currentUser = user;
    state.screen = 'home';
    state.authLoading = false;
    listenToFirestore();
    render();
  } else {
    currentUser = null;
    state.screen = 'login';
    state.authLoading = false;
    if (unsubscribeFirestore) unsubscribeFirestore();
    render();
  }
});

// ============== APP STATE ==============
let state = {
  screen: 'login',
  customers: [],
  listFilter: 'all',
  currentId: null,
  formData: null,
  properties: [],
  aiResult: null,
  aiLoading: false,
  aiError: null,
  showApiModal: false,
  authLoading: true,
};

function setState(updates) {
  state = { ...state, ...updates };
  if (updates.properties && currentUser) saveDataToFirestore(updates.properties);
  render();
}

function emptyForm() {
  return {
    address: '', width: '', length: '', dtThucTe: '', area: '', floors: '', sanXD: '',
    loGioiArea: '', loGioiRate: '80',
    extraArea: '', extraRate: '40',
    askingPrice: '', giaTT: '', donGiaXD: '7', hienTrang: '80',
    furniture: 'none', planning: 'clear',
    alleyType: 'mt', shape: 'rectangle',
    issues: [], legal: 'pink_book', direction: '', notes: '', isStarred: false
  };
}

// ============== HELPERS ==============
function legalLabel(v) { return { pink_book:'Sổ hồng riêng', red_book:'Sổ đỏ', co_owned:'Đồng sở hữu', pending:'Chờ sổ' }[v]||v; }
function alleyLabel(v) { return { mt:'Mặt tiền', alley1:'Hẻm > 6m', alley2:'Hẻm 3-5m', alley3:'Hẻm < 3m' }[v]||v; }
function shapeLabel(v) { return { rectangle:'Vuông vức', flared:'Nở hậu (+5%)', L:'Chữ L (+3%)', taper:'Tóp hậu (-13%)', xeo:'Xéo/Méo (-10%)', triangle:'Tam giác (-20%)' }[v]||v; }
function hienTrangLabel(v) {
  return { '100':'Xây mới', '90':'Cải tạo mới', '80':'Còn tốt', '60':'Trung bình', '40':'Cũ', '20':'Rất cũ', '5':'Nhà nát' }[String(v)] || v;
}
function furnitureLabel(v) {
  return { none:'Không có', basic:'Cơ bản', full:'Đầy đủ', luxury:'Cao cấp' }[v] || v;
}
function planningLabel(v) {
  return { clear:'Không vướng QH', road:'Dính lộ giới', public:'Đất công', other:'Quy hoạch khác' }[v] || v;
}
function fmtTy(val) {
  if (!val || isNaN(val) || val <= 0) return '—';
  if (val < 1) return Math.round(val * 1000) + ' triệu';
  return parseFloat(val).toFixed(2) + ' tỷ';
}

function issueLabel(v) { return { spiritual_temple:'Gần chùa', spiritual_grave:'Gần nghĩa trang/mộ', spiritual_shrine:'Gần đình/miếu', pole:'Cột điện/hố ga', noise:'Tiếng ồn', flood:'Ngập nước', tiny_alley:'Hẻm nội bộ', dead_end:'Hẻm cụt', road_hit:'Đâm đường', one_way:'Đường 1 chiều' }[v]||v; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ============== VALUATION CALCULATION ==============
function calculateValuation(p) {
  const area       = parseFloat(p.area)||0;
  const floors     = parseFloat(p.floors)||1;
  const width      = parseFloat(p.width)||0;
  const askingPrice = parseFloat(p.askingPrice)||0;
  const giaTT      = parseFloat(p.giaTT)||0;
  const donGiaXD   = parseFloat(p.donGiaXD)||7;
  const hienTrang  = parseFloat(p.hienTrang || p.doMoi)||80;
  const loGioiArea = parseFloat(p.loGioiArea)||0;
  const loGioiRate = parseFloat(p.loGioiRate)||80;
  const extraArea  = parseFloat(p.extraArea)||0;
  const extraRate  = parseFloat(p.extraRate)||40;

  // ═══ BƯỚC 1: Giá trị đất theo thị trường ═══
  const giaTriDatTT      = (area && giaTT) ? +(area * giaTT / 1000).toFixed(3) : 0;
  const giaTriLoGioi     = (loGioiArea && giaTT) ? +(loGioiArea * giaTT / 1000 * loGioiRate / 100).toFixed(3) : 0;
  const giaTriExtra      = (extraArea && giaTT) ? +(extraArea * giaTT / 1000 * extraRate / 100).toFixed(3) : 0;
  const giaTriDatTongCong = +(giaTriDatTT + giaTriLoGioi + giaTriExtra).toFixed(3);

  // ═══ BƯỚC 2: Hệ số lỗi — NHÂN HỆ SỐ (không cộng dồn) ═══
  const PENALTY_RATE = {
    spiritual_temple: -5,
    spiritual_grave:  -10,
    spiritual_shrine: -4,
    pole:   -3,
    noise:  -10,
    flood:  -8,
    tiny_alley: -5,
    dead_end:   -5,
    road_hit:  -12,
    one_way:    -6,
  };
  let heSoLoi = 1.0;
  const issueDetails = [];
  (p.issues||[]).forEach(iss => {
    const rate = PENALTY_RATE[iss];
    if (rate) {
      heSoLoi *= (1 + rate / 100);  // NHÂN hệ số độc lập
      issueDetails.push({ label: issueLabel(iss), pct: rate });
    }
  });
  const totalPenaltyPct = +((heSoLoi - 1) * 100).toFixed(1); // chỉ để hiển thị

  // ═══ BƯỚC 3: Giá trị đất sau trừ lỗi ═══
  const giaTriDatSauLoi = giaTriDatTongCong ? +(giaTriDatTongCong * heSoLoi).toFixed(3) : 0;

  // ═══ BƯỚC 4: Giá trị nhà ═══
  const sanXD = parseFloat(p.sanXD)||(area * floors);
  const giaTriNha = (sanXD && donGiaXD && hienTrang)
    ? +(sanXD * donGiaXD / 1000 * hienTrang / 100).toFixed(3) : 0;

  // ═══ BƯỚC 5: Hệ số điều chỉnh khác (hình dạng, pháp lý, mặt tiền) ═══
  const adjustments = [];
  const shapeDiscount = { rectangle:0, flared:0.05, L:0.03, taper:-0.13, xeo:-0.10, triangle:-0.20 }[p.shape]||0;
  if (shapeDiscount !== 0 && giaTriDatSauLoi)
    adjustments.push({ label:'Hình dạng: '+shapeLabel(p.shape), value: +(giaTriDatSauLoi*shapeDiscount).toFixed(3) });
  if (p.legal === 'co_owned' && giaTriDatSauLoi)
    adjustments.push({ label:'Đồng sở hữu', value: +(giaTriDatSauLoi*-0.05).toFixed(3) });
  else if (p.legal === 'pending' && giaTriDatSauLoi)
    adjustments.push({ label:'Chưa có sổ', value: +(giaTriDatSauLoi*-0.15).toFixed(3) });
  if (width > 4 && giaTriDatSauLoi)
    adjustments.push({ label:`Mặt tiền rộng ${width}m`, value: +(giaTriDatSauLoi*0.07).toFixed(3) });
  else if (width > 0 && width < 3 && giaTriDatSauLoi)
    adjustments.push({ label:`Mặt tiền hẹp ${width}m`, value: +(giaTriDatSauLoi*-0.05).toFixed(3) });
  const adjSum = adjustments.reduce((s,a)=>s+a.value, 0);

  // ═══ BƯỚC 5b: Nội thất ═══
  const FURNITURE_VALUE = { none:0, basic:0.05, full:0.15, luxury:0.35 };
  const furnitureValue = FURNITURE_VALUE[p.furniture] || 0;

  // ═══ BƯỚC 5c: Quy hoạch ═══
  const PLANNING_RATE = { clear:0, road:-0.10, public:-0.25, other:-0.15 };
  const planningRate = PLANNING_RATE[p.planning] || 0;
  const planningValue = giaTriDatSauLoi * planningRate;
  if (planningRate !== 0) adjustments.push({ label: planningLabel(p.planning), value: +planningValue.toFixed(3) });

  // ═══ BƯỚC 6: Giá trị BĐS ước tính ═══
  const estimatedValue = +(giaTriDatSauLoi + giaTriNha + adjSum + furnitureValue + planningValue).toFixed(3);

  // ═══ BƯỚC 7: Đơn giá đất chủ rao (tách ngược) ═══
  const donGiaRao = (askingPrice && area)
    ? +((askingPrice - giaTriNha) * 1000 / area).toFixed(1) : 0;

  // ═══ BƯỚC 8: TẦNG 1 — So sánh đơn giá đất ═══
  // giaTT KHÔNG bị thay đổi bởi penalty
  const chenhLechDatPct = (donGiaRao && giaTT)
    ? +((donGiaRao - giaTT) / giaTT * 100).toFixed(1) : null;
  const chenhLechDatTien = (donGiaRao && giaTT && area)
    ? +((donGiaRao - giaTT) * area / 1000).toFixed(3) : null;

  let verdictDat;
  if (chenhLechDatPct === null) {
    verdictDat = { type:'mid', text:'Chưa đủ dữ liệu' };
  } else if (chenhLechDatPct <= -5) {
    verdictDat = { type:'good', text:'🟢 Dưới thị trường' };
  } else if (chenhLechDatPct <= 5) {
    verdictDat = { type:'mid', text:'🟡 Phù hợp thị trường' };
  } else if (chenhLechDatPct <= 20) {
    verdictDat = { type:'warn', text:'🟠 Cao hơn thị trường' };
  } else {
    verdictDat = { type:'bad', text:'🔴 Vượt thị trường' };
  }

  // ═══ BƯỚC 9: TẦNG 2 — So sánh giá tổng BĐS ═══
  const chenhLechTongPct = (askingPrice && estimatedValue)
    ? +((askingPrice - estimatedValue) / estimatedValue * 100).toFixed(1) : null;
  const chenhLechTongTien = (askingPrice && estimatedValue)
    ? +(askingPrice - estimatedValue).toFixed(3) : null;

  let verdictTong;
  if (chenhLechTongPct === null) {
    verdictTong = { type:'mid', text:'Chưa đủ dữ liệu' };
  } else if (chenhLechTongPct <= -5) {
    verdictTong = { type:'good', text:'🟢 Dưới thị trường' };
  } else if (chenhLechTongPct <= 5) {
    verdictTong = { type:'mid', text:'🟡 Phù hợp thị trường' };
  } else if (chenhLechTongPct <= 20) {
    verdictTong = { type:'warn', text:'🟠 Cao hơn thị trường' };
  } else {
    verdictTong = { type:'bad', text:'🔴 Vượt thị trường' };
  }

  // Verdict tổng hợp (dùng cho badge ngoài danh sách)
  const verdict = chenhLechDatPct !== null ? verdictDat : verdictTong;

  // ═══ BƯỚC 10: Giá đàm phán theo tình huống thực tế ═══
  let openingOffer, targetDeal, damPhanLabel, damPhanNote;
  const chenhPct = chenhLechTongPct || 0;

  if (askingPrice > 0 && estimatedValue > 0 && chenhPct <= 0) {
    // Chủ bán THẤP hơn hoặc BẰNG ước tính → hàng tốt, chốt nhanh
    openingOffer = +(askingPrice * 0.97).toFixed(3);
    targetDeal   = +(askingPrice * 0.99).toFixed(3);
    damPhanLabel = '🟢 Hàng tốt — nên chốt nhanh';
    damPhanNote  = 'Giá chủ đang thấp hơn thị trường. Đừng kéo giá quá nhiều, dễ mất hàng.';
  } else if (chenhPct <= 10) {
    // Cao hơn TT ≤10% → đàm phán nhẹ
    openingOffer = +(estimatedValue * 0.97).toFixed(3);
    targetDeal   = +(estimatedValue * 0.99).toFixed(3);
    damPhanLabel = '🟡 Có thể đàm phán nhẹ';
    damPhanNote  = 'Giá cao hơn thị trường ' + chenhPct + '%. Đề xuất kéo về sát giá trị thực.';
  } else if (chenhPct <= 20) {
    // Cao hơn TT 10-20% → đàm phán vừa
    openingOffer = +(estimatedValue * 0.95).toFixed(3);
    targetDeal   = +(estimatedValue * 0.98).toFixed(3);
    damPhanLabel = '🟠 Cần đàm phán giảm';
    damPhanNote  = 'Giá cao hơn thị trường ' + chenhPct + '%. Cần kiên trì đàm phán.';
  } else {
    // Cao hơn TT >20% → khó
    openingOffer = +(estimatedValue * 0.92).toFixed(3);
    targetDeal   = +(estimatedValue * 0.96).toFixed(3);
    damPhanLabel = '🔴 Khó đàm phán';
    damPhanNote  = 'Giá cao hơn thị trường ' + chenhPct + '%. Cần nhiều thời gian hoặc cân nhắc bỏ qua.';
  }
  const suggestedDeal = targetDeal;

  // ═══ BƯỚC 11: Điểm mạnh / Điểm yếu ═══
  const strengths = [], weaknesses = [];
  if (p.shape === 'rectangle') strengths.push('Đất vuông vức, dễ thiết kế');
  if (p.shape === 'flared') strengths.push('Nở hậu - phong thủy tốt');
  if (p.legal === 'pink_book' || p.legal === 'red_book') strengths.push('Pháp lý rõ ràng ('+legalLabel(p.legal)+')');
  if (width > 4) strengths.push(`Mặt tiền ${width}m rộng, thanh khoản tốt`);
  if (hienTrang >= 90) strengths.push('Nhà gần mới, không cần cải tạo');
  if (p.alleyType === 'mt') strengths.push('Mặt tiền - tiềm năng kinh doanh');
  if (p.alleyType === 'alley1' || p.alleyType === 'alley2') strengths.push('Hẻm xe hơi - tiện lợi, yên tĩnh');
  issueDetails.forEach(d => weaknesses.push(`${d.label} (${d.pct}%)`));
  if (p.shape === 'taper') weaknesses.push('Tóp hậu - phong thủy không tốt');
  if (p.shape === 'triangle') weaknesses.push('Đất tam giác - khó thiết kế');
  if (hienTrang > 0 && hienTrang < 40) weaknesses.push(`Nhà cũ (còn ${hienTrang}%) - cần cải tạo lớn`);
  if (p.legal === 'pending') weaknesses.push('Chưa có sổ - rủi ro pháp lý cao');
  if (width > 0 && width < 3) weaknesses.push('Mặt tiền hẹp - khó thanh khoản');
  if (strengths.length === 0) strengths.push('Vị trí thị trường phản ánh đúng giá trị');
  if (weaknesses.length === 0) weaknesses.push('Không có điểm yếu nghiêm trọng');

  return {
    giaTriDatTT, giaTriLoGioi, giaTriExtra, giaTriDatTongCong, giaTriDatSauLoi, giaTriNha,
    adjustments, adjSum, estimatedValue, verdict, verdictDat, verdictTong,
    chenhLechDatPct, chenhLechDatTien,
    chenhLechTongPct, chenhLechTongTien,
    donGiaRao, giaTT, heSoLoi, totalPenaltyPct, issueDetails,
    openingOffer, targetDeal, suggestedDeal, damPhanLabel, damPhanNote,
    strengths, weaknesses,
    area, sanXD, donGiaXD, hienTrang,
    loGioiArea, loGioiRate, extraArea, extraRate,
  };
}

// ============== GEMINI AI ==============
async function callGeminiAI(property) {
  const apiKey = getApiKey();
  if (!apiKey) {
    setState({ showApiModal: true });
    return;
  }

  setState({ aiLoading: true, aiError: null, aiResult: null });

  try {
    const valuation = calculateValuation(property);
    const r2 = calculateValuation(property);
    const prompt = `Bạn là môi giới BĐS kỳ cựu 20 năm tại TP.HCM, am hiểu thị trường từng quận, từng hẻm. Bạn đang hỗ trợ đồng nghiệp phân tích một căn nhà để tư vấn khách mua. Hãy phân tích như một người trong nghề — thực tế, cụ thể, có thể áp dụng ngay.

=== THÔNG TIN CĂN NHÀ ===
Địa chỉ: ${property.address}
Diện tích: ${property.area}m² (${property.width}m × ${property.length}m) | ${property.floors} tầng | Hướng: ${property.direction||'chưa rõ'}
Vị trí: ${alleyLabel(property.alleyType)} | Hình dạng: ${shapeLabel(property.shape)} | Pháp lý: ${legalLabel(property.legal)}
Hiện trạng: ${hienTrangLabel(property.hienTrang||'80')} | Nội thất: ${furnitureLabel(property.furniture||'none')} | Yếu tố ngoại vi: ${(property.issues||[]).map(i=>issueLabel(i)).join(', ')||'không có'}
Giá chủ chào: ${property.askingPrice} tỷ
Giá đất khu vực (Biggee): ${property.giaTT} tr/m²
Giá trị BĐS ước tính (hệ thống): ${r2.estimatedValue.toFixed(2)} tỷ (đất ${r2.giaTriDatSauLoi.toFixed(2)} tỷ + nhà ${r2.giaTriNha.toFixed(2)} tỷ)
Đơn giá đất chủ đang tính: ${r2.donGiaRao} tr/m² (TT: ${property.giaTT} tr/m²)
Mô tả thực địa: ${property.notes||'không có'}

=== YÊU CẦU PHÂN TÍCH ===
Trả về JSON thuần, không markdown, không backtick:

{
  "summary": {
    "verdict": "Nên mua / Cân nhắc / Không nên mua",
    "quickNote": "1-2 câu nhận định thực tế nhất về căn này và giá chào — dựa vào mô tả thực địa là chính",
    "liquidity": "Tốt / Trung bình / Thấp",
    "valuationRange": "X.X – X.X tỷ"
  },
  "negotiation": {
    "strategy": "Chiến lược đàm phán cụ thể cho căn này (1-2 câu)",
    "openingOffer": "X.X tỷ",
    "targetPrice": "X.X tỷ",
    "redLine": "X.X tỷ",
    "sellerPsychology": "Nhận định tâm lý chủ nhà dựa trên mô tả thực địa và giá chào"
  },
  "marketContext": {
    "priceRange": "XXX–XXX triệu/m²",
    "trend": "Tăng / Ổn định / Giảm",
    "comparables": "1-2 căn tương đương khu vực và mức giá thực tế"
  },
  "risks": [
    "Rủi ro cụ thể 1",
    "Rủi ro cụ thể 2"

- CHỈ trả về JSON thuần`;

    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-goog-api-key': apiKey
      },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: { temperature: 0.7 }
      })
    });

    if (!response.ok) {
      let errMsg = 'API lỗi: ' + response.status;
      try { const e = await response.json(); errMsg = e.error?.message || errMsg; } catch(x) {}
      throw new Error(errMsg);
    }

    const data = await response.json();
    const rawText = data.candidates[0].content.parts[0].text;
    const cleanText = rawText.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(cleanText);
    // Lưu kết quả AI vào property tương ứng để giữ lại khi thoát màn hình
    const updatedProps = state.properties.map(function(prop) {
      if (prop.id === property.id) { return Object.assign({}, prop, { aiResult: parsed }); }
      return prop;
    });
    state.properties = updatedProps;
    if (currentUser) saveDataToFirestore(updatedProps);
    setState({ aiResult: parsed, aiLoading: false });
  } catch(err) {
    console.error(err);
    setState({ aiError: 'Lỗi: ' + err.message + '. Kiểm tra API key hoặc kết nối mạng.', aiLoading: false });
  }
}

// ============== NAVIGATION ==============
function nav(screen, opts={}) {
  setState({ screen, ...opts });
  window.scrollTo(0, 0);
}

function openProperty(id) { nav('detail', { currentId: id }); }
function openValuation(id) { nav('valuation', { currentId: id }); }
function openAI(id) { 
  const p = state.properties.find(x => x.id === id);
  if (p) {
    if (p.aiResult) {
      // Có kết quả cũ → hiển thị lại, không gọi API
      setState({ screen: 'ai', currentId: id, aiResult: p.aiResult, aiError: null });
    } else {
      // Chưa có → gọi API mới
      setState({ screen: 'ai', currentId: id, aiResult: null, aiError: null });
      callGeminiAI(p);
    }
  }
}
function newProperty() { nav('form', { currentId: null, formData: emptyForm() }); }
function editProperty(id) {
  const p = state.properties.find(x => x.id === id);
  if (p) nav('form', { currentId: id, formData: { ...p } });
}

function saveProperty() {
  // Đọc lại toàn bộ giá trị mới nhất từ các ô input thực tế (phòng khi ký tự cuối chưa kịp lưu)
  document.querySelectorAll('[data-field]').forEach(function(el) {
    state.formData[el.getAttribute('data-field')] = el.value;
  });
  const f = state.formData;
  if (!f.address) { alert('Vui lòng nhập địa chỉ'); return; }
  let newProps;
  let newId = state.currentId;
  if (state.currentId) {
    newProps = state.properties.map(p => p.id === state.currentId ? { ...p, ...f } : p);
  } else {
    newId = 'p' + Date.now();
    newProps = [{ ...f, id: newId, createdAt: Date.now() }, ...state.properties];
  }
  setState({ properties: newProps, currentId: newId, screen: 'detail' });
}

function deleteProperty(id) {
  if (!confirm('Xóa hồ sơ này?')) return;
  setState({ properties: state.properties.filter(p => p.id !== id), screen: 'list', currentId: null });
}

// Gõ text: chỉ lưu ngầm, KHÔNG vẽ lại màn hình (tránh nhảy con trỏ)
function updateForm(key, value) {
  state.formData[key] = value;

  // Auto tính DT đất CN = Ngang × Dài (nếu user chưa tự nhập area)
  if (key === 'width' || key === 'length') {
    if (!state.formData._areaEdited) {
      const w = parseFloat(state.formData.width)||0;
      const l = parseFloat(state.formData.length)||0;
      if (w && l) {
        state.formData.area = (w * l).toFixed(1);
        const el = document.getElementById('input-area');
        if (el) el.value = state.formData.area;
      }
    }
  }
  if (key === 'area') state.formData._areaEdited = true;

  // Auto tính DT sàn XD = DT CN × Số tầng (nếu user chưa tự nhập sanXD)
  if (key === 'area' || key === 'floors') {
    if (!state.formData._sanXDEdited) {
      const a = parseFloat(state.formData.area)||0;
      const fl = parseFloat(state.formData.floors)||0;
      if (a && fl) {
        state.formData.sanXD = Math.round(a * fl);
        const el = document.getElementById('input-sanXD');
        if (el) el.value = state.formData.sanXD;
      }
    }
  }
  if (key === 'sanXD') state.formData._sanXDEdited = true;

  // Bật/tắt nút Lưu
  if (key === 'address') {
    var saveBtn = document.getElementById('save-btn');
    if (saveBtn) saveBtn.disabled = !value;
  }
}

// Bấm chip (chọn lựa): cần vẽ lại để hiện trạng thái chọn
function updateFormRender(key, value) {
  state.formData[key] = value;
  render();
}

function toggleIssue(issue) {
  const arr = state.formData.issues || [];
  const newArr = arr.includes(issue) ? arr.filter(i=>i!==issue) : [...arr, issue];
  state.formData.issues = newArr;
  render();
}

// ============== RENDER ==============
function render() {
  const root = document.getElementById('app');
  let html = '';

  if (state.authLoading) { html = renderLoading(); root.innerHTML = html; return; }
  if (state.screen === 'login') { html = renderLogin(); root.innerHTML = html; return; }
  if (state.screen === 'home') html = renderHome();
  else if (state.screen === 'list') html = renderList();
  else if (state.screen === 'form') html = renderForm();
  else if (state.screen === 'detail') html = renderDetail();
  else if (state.screen === 'valuation') html = renderValuation();
  else if (state.screen === 'ai') html = renderAI();
  else if (state.screen === 'customers') html = renderCustomers();
  else if (state.screen === 'customer-form') html = renderCustomerForm();
  else if (state.screen === 'customer-detail') html = renderCustomerDetail();
  else if (state.screen === 'customer-match') html = renderCustomerMatch();

  if (state.showApiModal) html += renderApiModal();

  root.innerHTML = html;
}

            style="margin-top:10px;width:100%;padding:13px;border-radius:12px;border:1.5px solid #FF1744;background:white;color:#FF1744;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;">

}

function field(label, key, value, type, placeholder) {
  return `
    <div class="field">
      <div class="field-label">${label}</div>
      <input class="input" type="${type}" value="${esc(value)}" placeholder="${placeholder}" 
        data-field="${key}" oninput="updateForm('${key}', this.value)" />
    </div>`;
}

function chipRow(label, key, options, current) {
  return `
    <div class="field-label">${label}</div>
    <div class="chip-row">
      ${options.map(o => `
        <button class="chip ${current===o.v?'on':''}" onclick="updateFormRender('${key}','${o.v}')">${o.l}</button>
      `).join('')}
    </div>`;
}

function saveApiKeyAndContinue() {
  const key = document.getElementById('apikey-input').value.trim();
  if (!key) { alert('Vui lòng nhập API key'); return; }
  setApiKey(key);
  setState({ showApiModal: false });
  const p = state.properties.find(x => x.id === state.currentId);
  if (p && state.screen === 'ai') callGeminiAI(p);
}

async function autoFillFromNotes() {
  const notes = state.formData.notes || '';
  if (!notes.trim()) {
    alert('Vui lòng nhập mô tả trước khi điền tự động.');
    return;
  }
  const apiKey = getApiKey();
  if (!apiKey) { setState({ showApiModal: true }); return; }

  // Hiển thị loading
  const btn = document.getElementById('autofill-btn');
  const icon = document.getElementById('autofill-icon');
  const text = document.getElementById('autofill-text');
  if (btn) { btn.disabled = true; if(icon) icon.textContent = '⏳'; if(text) text.textContent = 'Đang phân tích...'; }

  try {
    const prompt = `Đọc đoạn mô tả bất động sản sau và trích xuất thông tin. Chỉ trả về JSON thuần, không markdown, không backtick:

MÔ TẢ:
${notes}

Trả về JSON với các trường sau (để trống "" nếu không có thông tin):
{
  "address": "địa chỉ đầy đủ",
  "width": "số mét ngang (chỉ số, không đơn vị)",
  "length": "số mét dài (chỉ số, không đơn vị)",
  "area": "diện tích m2 (chỉ số, không đơn vị, để trống nếu có ngang×dài)",
  "floors": "số tầng (chỉ số)",
  "direction": "hướng cửa chính (một trong: Đông, Tây, Nam, Bắc, Đông Nam, Đông Bắc, Tây Nam, Tây Bắc)",
  "alleyType": "loại đường (một trong: mt=mặt tiền, alley1=hẻm>6m, alley2=hẻm3-5m, alley3=hẻm<3m)",
  "shape": "hình dạng (một trong: rectangle=vuông vức, flared=nở hậu, L=chữL, taper=tóp hậu, xeo=xéo méo, triangle=tam giác)",
  "legal": "pháp lý (một trong: pink_book=sổ hồng, red_book=sổ đỏ, co_owned=đồng sở hữu, pending=chờ sổ)",
  "askingPrice": "giá bán (chỉ số tỷ, ví dụ 9 hoặc 9.5)",
  "hienTrang": "hiện trạng nhà (một trong: 100=xây mới, 90=cải tạo mới, 80=còn tốt, 60=trung bình, 40=cũ, 20=rất cũ, 5=nhà nát)",
  "loGioiArea": "diện tích ranh lộ giới m² nếu có (chỉ số, để trống nếu không có)",
  "extraArea": "diện tích đất không CN m² nếu có (chỉ số, để trống nếu không có)",
  "furniture": "nội thất (một trong: none=không có, basic=cơ bản, full=đầy đủ, luxury=cao cấp)",
  "planning": "quy hoạch (một trong: clear=không vướng, road=dính lộ giới, public=đất công, other=quy hoạch khác)"
}`;

    const resp = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
      body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { temperature: 0.1 } })
    });

    const data = await resp.json();
    const raw = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    const clean = raw.replace(/```json|```/g, '').trim();
    const extracted = JSON.parse(clean);

    // Điền vào form — chỉ điền trường còn trống
    const f = state.formData;
    const updated = { ...f };
    if (extracted.address && !f.address) updated.address = extracted.address;
    if (extracted.width && !f.width) updated.width = extracted.width;
    if (extracted.length && !f.length) updated.length = extracted.length;
    if (extracted.area && !f.area) updated.area = extracted.area;
    if (extracted.floors && !f.floors) updated.floors = extracted.floors;
    if (extracted.direction && !f.direction) updated.direction = extracted.direction;
    if (extracted.alleyType && f.alleyType === 'mt') updated.alleyType = extracted.alleyType;
    if (extracted.shape && f.shape === 'rectangle') updated.shape = extracted.shape;
    if (extracted.legal && f.legal === 'pink_book') updated.legal = extracted.legal;
    if (extracted.askingPrice && !f.askingPrice) updated.askingPrice = extracted.askingPrice;
    if (extracted.hienTrang && f.hienTrang === '80') updated.hienTrang = extracted.hienTrang;
    if (extracted.loGioiArea && !f.loGioiArea) updated.loGioiArea = extracted.loGioiArea;
    if (extracted.extraArea && !f.extraArea) updated.extraArea = extracted.extraArea;
    if (extracted.furniture && f.furniture === 'none') updated.furniture = extracted.furniture;
    if (extracted.planning && f.planning === 'clear') updated.planning = extracted.planning;

    // Auto tính dtThucTe = width × length
    if (updated.width && updated.length) {
      updated.dtThucTe = (parseFloat(updated.width) * parseFloat(updated.length)).toFixed(1);
      if (!updated.area) updated.area = updated.dtThucTe;
    }
    // Auto tính sanXD từ area × floors
    if (updated.area && updated.floors && !updated._sanXDEdited) {
      updated.sanXD = Math.round(parseFloat(updated.area) * parseFloat(updated.floors));
    }

    setState({ formData: updated });

    // Cập nhật UI các input auto
    setTimeout(() => {
      const areaEl = document.getElementById('input-area');
      const sanXDEl = document.getElementById('input-sanXD');
      if (areaEl && updated.area) areaEl.value = updated.area;
      if (sanXDEl && updated.sanXD) sanXDEl.value = updated.sanXD;
    }, 50);

  } catch(e) {
    alert('Không phân tích được. Vui lòng thử lại.');
    console.error(e);
  } finally {
    if (btn) { btn.disabled = false; if(icon) icon.textContent = '✨'; if(text) text.textContent = 'Điền tự động từ mô tả'; }
  }
}

function addIssue(v) {
  if (!v) return;
  const issues = [...(state.formData.issues||[])];
  if (!issues.includes(v)) issues.push(v);
  setState({ formData: { ...state.formData, issues } });
}
function removeIssue(v) {
  const issues = (state.formData.issues||[]).filter(x => x !== v);
  setState({ formData: { ...state.formData, issues } });
}

function statusLabel(s) {
  return { hot:'🔥 Nóng', watching:'👀 Đang xem', cold:'❄️ Lạnh', closed:'✅ Đã chốt' }[s] || s;
}
function statusColor(s) {
  return { hot:'#FF1744', watching:'#B45309', cold:'#1565C0', closed:'#2E7D32' }[s] || '#888';
}
function purposeLabel(s) {
  return { buy_live:'Mua ở', invest:'Đầu tư', both:'Mua ở + Đầu tư' }[s] || s;
}

async function toggleStar(id, e) {
  e && e.stopPropagation();
  const user = firebase.auth().currentUser;
  if (!user) return;
  const p = state.properties.find(x => x.id === id);
  if (!p) return;
  const newVal = !p.isStarred;
  await db.collection('users').doc(user.uid).collection('properties').doc(id).update({ isStarred: newVal });
  state.properties = state.properties.map(x => x.id === id ? { ...x, isStarred: newVal } : x);
  render();
}

async function saveCustomer() {
  const f = state.customerForm;
  if (!f.name) { alert('Vui lòng nhập tên khách hàng'); return; }
  const user = firebase.auth().currentUser;
  if (!user) return;
  const data = { ...f, updatedAt: Date.now() };
  try {
    if (state.currentCustomerId) {
      await db.collection('users').doc(user.uid).collection('customers').doc(state.currentCustomerId).set(data);
      state.customers = state.customers.map(c => c.id === state.currentCustomerId ? { id: state.currentCustomerId, ...data } : c);
    } else {
      data.createdAt = Date.now();
      const ref = await db.collection('users').doc(user.uid).collection('customers').add(data);
      state.customers = [{ id: ref.id, ...data }, ...state.customers];
    }
    nav('customers');
  } catch(e) { alert('Lỗi lưu: ' + e.message); }
}

async function deleteCustomer(id) {
  if (!confirm('Xóa khách hàng này?')) return;
  const user = firebase.auth().currentUser;
  if (!user) return;
  await db.collection('users').doc(user.uid).collection('customers').doc(id).delete();
  state.customers = state.customers.filter(c => c.id !== id);
  nav('customers');
}

function newCustomer() {
  nav('customer-form', { currentCustomerId: null, customerForm: emptyCustomer() });
}

function editCustomer(id) {
  const c = state.customers.find(x => x.id === id);
  if (c) nav('customer-form', { currentCustomerId: id, customerForm: { ...c } });
}

function openCustomer(id) {
  nav('customer-detail', { currentCustomerId: id });
}

function updateCustomerForm(key, value) {
  state.customerForm = { ...state.customerForm, [key]: value };
}

async function matchCustomerAI(customerId) {
  const customer = state.customers.find(c => c.id === customerId);
  if (!customer) return;
  if (!state.properties || state.properties.length === 0) {
    alert('Chưa có hồ sơ nhà nào. Vui lòng thêm hồ sơ trước.');
    return;
  }
  const apiKey = getApiKey();
  if (!apiKey) { setState({ showApiModal: true }); return; }

  nav('customer-match', { currentCustomerId: customerId, matchResult: null, matchLoading: true });

  const propList = state.properties.slice(0, 15).map((p, i) => {
    const r = (p.askingPrice && p.giaTT) ? calculateValuation(p) : null;
    return `Căn ${i+1}: ${p.address}
  Giá: ${p.askingPrice} tỷ | DT: ${p.area}m² | ${p.floors} tầng
  Vị trí: ${alleyLabel(p.alleyType)} | Hướng: ${p.direction||'chưa rõ'}
  Pháp lý: ${legalLabel(p.legal)} | Hình dạng: ${shapeLabel(p.shape)}
  Giá trị TT ước tính: ${r ? r.estimatedValue.toFixed(2)+' tỷ' : 'chưa tính'}
  Mô tả: ${p.notes||'không có'}`;
  }).join('\n\n');

  const prompt = `Bạn là môi giới BĐS kỳ cựu. Hãy phân tích và ghép khách với nhà phù hợp nhất.

THÔNG TIN KHÁCH HÀNG:
Tên: ${customer.name}
Ngân sách: ${customer.budgetMin||'?'} – ${customer.budgetMax||'?'} tỷ
Khu vực muốn: ${customer.areas||'chưa rõ'}
Mục đích: ${purposeLabel(customer.purpose)}
Ghi chú nhu cầu: ${customer.notes||'không có'}

DANH SÁCH NHÀ HIỆN CÓ:
${propList}

Hãy chọn top 3 căn phù hợp nhất và giải thích. Trả về JSON thuần:
{
  "matches": [
    {
      "index": 1,
      "address": "địa chỉ căn",
      "score": "Rất phù hợp / Phù hợp / Tạm được",
      "reasons": ["lý do 1", "lý do 2"],
      "warnings": ["điểm chưa phù hợp nếu có"],
      "tip": "gợi ý khi giới thiệu cho khách này"
    }
  ],
  "summary": "nhận xét tổng quan về khách và thị trường hiện tại"
}`;

  try {
    const resp = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
      body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { temperature: 0.2 } })
    });
    const data = await resp.json();
    const raw = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    const clean = raw.replace(/```json|```/g, '').trim();
    const result = JSON.parse(clean);
    setState({ matchResult: result, matchLoading: false });
  } catch(e) {
    setState({ matchResult: null, matchLoading: false, matchError: 'Không phân tích được. Thử lại.' });
  }
}

          <div style="display:inline-block;font-size:12px;font-weight:700;color:${m.score==='Rất phù hợp'?'#2E7D32':m.score==='Phù hợp'?'#B45309':'#888'};background:${m.score==='Rất phù hợp'?'#F0FFF4':m.score==='Phù hợp'?'#FFFBEB':'#f5f5f5'};padding:3px 10px;border-radius:20px;margin-bottom:10px;">${esc(m.score||'')}</div>
          ${(m.reasons||[]).map(r=>`<div style="display:flex;gap:8px;padding:3px 0;font-size:13px;"><span style="color:#2E7D32;flex-shrink:0;">✓</span><span>${esc(r)}</span></div>`).join('')}
          ${(m.warnings||[]).map(w=>`<div style="display:flex;gap:8px;padding:3px 0;font-size:13px;"><span style="color:#FF1744;flex-shrink:0;">!</span><span>${esc(w)}</span></div>`).join('')}
          ${m.tip ? `<div style="font-size:13px;color:#555;font-style:italic;padding-top:8px;border-top:1px solid #f5f5f5;margin-top:8px;">💡 ${esc(m.tip)}</div>` : ''}
        </div>
        `).join('')}

      ` : `
        <div style="text-align:center;padding:40px 20px;color:#888;">
          <div style="font-size:14px;">Không có kết quả. Thử lại.</div>
          <button class="btn-primary" style="margin-top:16px;" onclick="matchCustomerAI('${c.id}')">🤖 Thử lại</button>
        </div>
      `}
    </div>
    <div class="bottom-bar">
      <button class="btn-primary" onclick="matchCustomerAI('${c.id}')" style="width:100%;">🤖 Phân tích lại</button>
    </div>
  </div>`;
}

// ============== INIT ==============
// Firebase onAuthStateChanged sẽ gọi render() khi sẵn sàng
</script>
</body>
</html>
