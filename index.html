        ${c.direction ? `<div class="info-row">
          <span class="info-lbl">Hướng nhà</span>
          <span class="info-val">${esc(c.direction)}</span>
        </div>` : ''}
        ${c.alleyType ? `<div class="info-row">
          <span class="info-lbl">Loại đường / hẻm</span>
          <span class="info-val">${alleyLabel(c.alleyType)}</span>
        </div>` : ''}
        ${c.hienTrang ? `<div class="info-row">
          <span class="info-lbl">Hiện trạng nhà</span>
          <span class="info-val">${hienTrangLabel(c.hienTrang)}</span>
        </div>` : ''}
      </div>

      ${(c.priority || c.exclude || c.notes) ? `<div class="card" style="margin-bottom:16px;">
        ${c.priority ? `<div style="${(c.exclude||c.notes)?'padding-bottom:14px;border-bottom:1px solid #E8E8E8;margin-bottom:14px;':''}">
          <div style="font-size:12px;color:#000000;margin-bottom:4px;">ƯU TIÊN</div>
          <div class="notes-text">${esc(c.priority)}</div>
        </div>` : ''}
        ${c.exclude ? `<div style="${c.notes?'padding-bottom:14px;border-bottom:1px solid #E8E8E8;margin-bottom:14px;':''}">
          <div style="font-size:12px;color:#000000;margin-bottom:4px;">LOẠI TRỪ</div>
          <div class="notes-text">${esc(c.exclude)}</div>
        </div>` : ''}
        ${c.notes ? `<div>
          <div style="font-size:12px;color:#000000;margin-bottom:4px;">GHI CHÚ THÊM</div>
          <div class="notes-text">${esc(c.notes)}</div>
        </div>` : ''}
      </div>` : ''}

      <div class="card" style="margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <div style="font-size:11px;font-weight:700;letter-spacing:1px;color:#FF1744;">LỊCH HẸN</div>
          <button onclick="setState({showAppointmentModal:'${c.id}'})"
            style="font-size:12px;font-weight:700;color:#FF1744;background:none;border:1.5px solid #FF1744;border-radius:20px;padding:3px 12px;cursor:pointer;">+ Thêm</button>
        </div>
        ${c.appointments && c.appointments.length > 0 ? c.appointments.map(a => {
          const d = new Date(a.datetime);
          const timeStr = isNaN(d) ? '' : d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}) + ' · ' + d.toLocaleDateString('vi-VN');
          return `
        <div style="padding:10px 0;border-bottom:1px solid #f5f5f5;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;">
            <div style="flex:1;padding-right:8px;">
              <span style="font-size:14px;color:#000000;font-weight:700;">${appointmentTypeLabel(a.type)}</span>
              <span style="font-size:14px;color:#000000;"> · ${timeStr}</span>
            </div>
            <div style="display:flex;gap:10px;flex-shrink:0;">
              <button onclick="copyAppointmentToZalo('${c.id}','${a.id}')" style="background:none;border:none;color:#FF1744;font-size:12px;font-weight:700;cursor:pointer;padding:0;">Copy</button>
              <button onclick="deleteAppointment('${c.id}','${a.id}')" style="background:none;border:none;color:#ccc;font-size:16px;cursor:pointer;padding:0;line-height:1;">×</button>
            </div>
          </div>
          ${a.location || a.note ? `<div style="font-size:12px;color:#888;">${a.location ? esc(a.location) : ''}${a.location && a.note ? ' · ' : ''}${a.note ? esc(a.note) : ''}</div>` : ''}
        </div>`;
        }).join('') : '<div style="font-size:14px;color:#000000;padding:4px 0;">Chưa có lịch hẹn nào</div>'}

        ${state.showAppointmentModal === c.id ? `
        <div style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:flex-end;">
          <div style="background:white;width:100%;border-radius:20px 20px 0 0;padding:20px 16px 40px;max-height:85vh;overflow-y:auto;">
            <div style="font-size:15px;font-weight:700;margin-bottom:16px;">Thêm lịch hẹn</div>

            <div class="f-select-wrap">
              <span class="field-label">Loại lịch</span>
              <select class="input" id="appt-type-${c.id}">
                ${[{v:'xem_nha',l:'Xem nhà'},{v:'tiep_khach',l:'Tiếp khách'},{v:'dam_phan',l:'Đàm phán'},{v:'cong_chung',l:'Công chứng'},{v:'khac',l:'Khác'}]
                  .map(o=>`<option value="${o.v}">${o.l}</option>`).join('')}
              </select>
            </div>

            <div class="field" style="margin-top:16px;">
              <label class="field-label">Thời gian</label>
              <input class="input" style="margin-top:8px;" type="datetime-local" id="appt-time-${c.id}">
            </div>

            <div class="field" style="margin-top:16px;">
              <label class="field-label">Địa điểm (không bắt buộc)</label>
              <input class="input" style="margin-top:8px;" type="text" id="appt-loc-${c.id}" placeholder="Vd: 123 Lê Văn Sỹ, Q.3">
            </div>

            <div class="field" style="margin-top:16px;">
              <label class="field-label">Ghi chú (không bắt buộc)</label>
              <input class="input" style="margin-top:8px;" type="text" id="appt-note-${c.id}" placeholder="Vd: nhớ mang hợp đồng mẫu">
            </div>

            <div style="display:flex;gap:10px;margin-top:20px;">
              <button onclick="setState({showAppointmentModal:null})" style="flex:1;padding:12px;border-radius:12px;border:1.5px solid #E8E8E8;background:white;color:#1a1a1a;font-size:14px;font-weight:600;cursor:pointer;">Hủy</button>
              <button onclick="addAppointment('${c.id}', document.getElementById('appt-type-${c.id}').value, document.getElementById('appt-time-${c.id}').value, document.getElementById('appt-loc-${c.id}').value, document.getElementById('appt-note-${c.id}').value)"
                style="flex:1;padding:12px;border-radius:12px;border:none;background:#FF1744;color:white;font-size:14px;font-weight:700;cursor:pointer;">Lưu lịch hẹn</button>
            </div>
          </div>
        </div>` : ''}
      </div>

      <div class="card" style="margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <div style="font-size:11px;font-weight:700;letter-spacing:1px;color:#FF1744;">ĐÃ GHIM</div>
          <button onclick="openSendModal('${c.id}')"
            style="font-size:12px;font-weight:700;color:#FF1744;background:none;border:1.5px solid #FF1744;border-radius:20px;padding:3px 12px;cursor:pointer;">+ Ghim</button>
        </div>
        ${c.sentHistory && c.sentHistory.length > 0 ? c.sentHistory.map((h, idx) => `
        <div style="padding:10px 0;border-bottom:1px solid #f5f5f5;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;">
            <div style="font-size:14px;color:#000000;flex:1;padding-right:8px;">${esc(h.address||'')}</div>
            <button onclick="deleteSentHistory('${c.id}',${idx})" style="background:none;border:none;color:#ccc;font-size:16px;cursor:pointer;padding:0;line-height:1;flex-shrink:0;">×</button>
          </div>
          <div style="font-size:12px;color:#888;">${h.date||''}${h.note ? ' · '+esc(h.note) : ''}</div>
        </div>`).join('') : '<div style="font-size:14px;color:#000000;padding:4px 0;">Chưa ghim nhà nào</div>'}

        ${state.showSendModal === c.id ? `
        <div style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:flex-end;">
          <div style="background:white;width:100%;border-radius:20px 20px 0 0;padding:20px 16px 40px;max-height:85vh;display:flex;flex-direction:column;">
            <div style="font-size:15px;font-weight:700;margin-bottom:12px;">Ghim nhà cho khách</div>
            <input class="input" type="text" placeholder="Tìm theo địa chỉ..." value="${state.sendModalSearch||''}"
              list="address-suggestions-modal"
              oninput="setState({sendModalSearch:this.value})" style="margin-bottom:12px;flex-shrink:0;" />
            <datalist id="address-suggestions-modal">
              ${addressSuggestions().map(s => `<option value="${esc(s)}">`).join('')}
            </datalist>
            <div style="overflow-y:auto;margin-bottom:16px;flex:1;">
              ${(() => {
                const q = (state.sendModalSearch||'').toLowerCase().trim();
                const list = q ? state.properties.filter(pr => (pr.address||'').toLowerCase().includes(q)) : state.properties;
                if (list.length === 0) return `<div style="font-size:13px;color:#888;padding:8px 0;">${state.properties.length === 0 ? 'Chưa có hồ sơ nào' : 'Không tìm thấy'}</div>`;
                return list.map(pr => `
                <div style="padding:10px 0;border-bottom:1px solid #f5f5f5;">
                  <div style="font-size:13px;font-weight:600;margin-bottom:8px;">${esc(pr.address)}</div>
                  <div style="display:flex;gap:6px;">
                    <input type="text" id="note-${pr.id}" placeholder="Ghi chú (vd: đã xem, thích, chưa xem...)"
                      style="flex:1;padding:8px 10px;border:1px solid #E8E8E8;border-radius:8px;font-size:12px;font-family:inherit;" />
                    <button onclick="addSentHistory('${c.id}','${pr.id}','', document.getElementById('note-${pr.id}').value)"
                      style="padding:8px 14px;border-radius:8px;border:1.5px solid #FF1744;background:#FF1744;color:white;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;">Lưu</button>
                  </div>
                </div>`).join('');
              })()}
            </div>
            <button onclick="closeSendModal()" style="width:100%;padding:12px;border-radius:12px;border:1.5px solid #E8E8E8;background:white;color:#1a1a1a;font-size:14px;font-weight:600;cursor:pointer;flex-shrink:0;">Đóng</button>
          </div>
        </div>` : ''}
      </div>

    </div>
    <div class="bottom-bar">
      <div class="bar-2">
        <button class="btn-secondary" onclick="editCustomer('${c.id}')">✏️ Sửa</button>
        <button class="btn-secondary" onclick="matchCustomerAI('${c.id}')">Ghép nhà AI</button>
      </div>
    </div>
  </div>`;
}

function renderCustomerMatch() {
  const c = state.customers.find(x => x.id === state.currentCustomerId);
  if (!c) { setTimeout(()=>nav('customers'), 0); return ''; }
  const result = state.matchResult;
  const loading = state.matchLoading;

  return `<div class="screen">
    <div class="topbar">
      <button class="topbar-back" onclick="nav('customer-detail')">‹</button>
      <div class="topbar-title">Ghép nhà AI</div>
    </div>
    <div class="content-pad" style="padding-top:16px;">

      <div class="card" style="margin-bottom:16px;">
        <div style="font-size:11px;color:#888;margin-bottom:4px;">ĐANG TÌM CHO</div>
        <div style="font-size:16px;font-weight:800;">${esc(c.name)}</div>
        <div style="font-size:13px;color:#555;margin-top:2px;">${c.budgetMax ? 'Tối đa '+c.budgetMax+' tỷ' : 'Chưa rõ ngân sách'}${c.district ? ' · '+esc(c.district) : ''}${c.purpose ? ' · '+purposeLabel(c.purpose) : ''}</div>
      </div>

      ${loading ? `
        <div style="text-align:center;padding:60px 20px;">
          <div style="font-size:20px;font-weight:900;color:#FF1744;margin-bottom:16px;">+AI</div>
          <div style="font-size:16px;font-weight:600;margin-bottom:8px;">AI đang phân tích...</div>
          <div style="font-size:13px;color:#888;">Đang so sánh ${state.properties.length} hồ sơ nhà</div>
        </div>
      ` : result ? `

        ${result.summary ? `
        <div class="card" style="background:#FFFFFF;color:#1a1a1a;border:1px solid #eee;border-left:1.5px solid #FF1744;margin-bottom:16px;">
          <div style="font-size:10px;font-weight:800;color:#FF1744;letter-spacing:2px;margin-bottom:12px;">NHẬN XÉT TỔNG QUAN</div>
          <div style="font-size:14px;color:#1a1a1a;line-height:1.6;">${esc(result.summary)}</div>
        </div>` : ''}

        ${(result.matches||[]).map((m, i) => `
        <div class="card" style="margin-bottom:12px;border:1.5px solid ${i===0?'#FF1744':'#E8E8E8'};">
          ${i===0 ? `<div style="font-size:11px;font-weight:700;color:#FF1744;margin-bottom:8px;">🏆 PHÙ HỢP NHẤT</div>` : ''}
          <div style="font-size:15px;font-weight:700;margin-bottom:4px;">${esc(m.address||'')}</div>
          <div style="display:inline-block;font-size:12px;font-weight:700;color:${m.score==='Rất phù hợp'?'#2E7D32':m.score==='Phù hợp'?'#B45309':'#888'};background:${m.score==='Rất phù hợp'?'#F0FFF4':m.score==='Phù hợp'?'#FFFBEB':'#f5f5f5'};padding:3px 10px;border-radius:20px;margin-bottom:10px;">${esc(m.score||'')}</div>
          ${(m.reasons||[]).map(r=>`<div style="display:flex;gap:8px;padding:3px 0;font-size:13px;"><span style="color:#2E7D32;flex-shrink:0;">✓</span><span>${esc(r)}</span></div>`).join('')}
          ${(m.warnings||[]).map(w=>`<div style="display:flex;gap:8px;padding:3px 0;font-size:13px;"><span style="color:#FF1744;flex-shrink:0;">!</span><span>${esc(w)}</span></div>`).join('')}
          ${m.tip ? `<div style="font-size:13px;color:#555;font-style:italic;padding-top:8px;border-top:1px solid #f5f5f5;margin-top:8px;">💡 ${esc(m.tip)}</div>` : ''}
        </div>
        `).join('')}

      ` : `
        <div style="text-align:center;padding:40px 20px;color:#888;">
          <div style="font-size:14px;">Không có kết quả. Thử lại.</div>
          <button class="btn-primary" style="margin-top:16px;" onclick="matchCustomerAI('${c.id}')">Ghép nhà AI</button>
        </div>
      `}
    </div>
    <div class="bottom-bar">
      <button class="btn-primary" onclick="matchCustomerAI('${c.id}')" style="width:100%;">Ghép nhà AI</button>
    </div>
  </div>`;
}

// ============== INIT ==============
// Firebase onAuthStateChanged sẽ gọi render() khi sẵn sàng
</script>
</body>
</html>
